version: "3.9"

services:

  # Banco de dados PostgreSQL
  db:
    container_name: cesjb_db
    image: postgres:12
    environment:
      POSTGRES_PASSWORD: Xtz450***
      POSTGRES_USER: postgres
      POSTGRES_DB: cesjb_db
    ports:
      - "5438:5432"
    volumes:
      - cesjb_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API Go
  api:
    container_name: cesjb_api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: Xtz450***
      DB_NAME: cesjb_db
      API_PORT: 8088
      SECRET_KEY: gK8U7t8hszWIDx8qNKwnjiihvHn07IwvVWnTHQLvWTChNAD54+DcWHOAyV4CUJNamrO7uXS+A7CgoxD8ZJsNlg==
    depends_on:
      db:
        condition: service_healthy

  # Frontend servido pelo nginx
  frontend:
    container_name: cesjb_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  cesjb_pgdata: {}