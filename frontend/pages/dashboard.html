<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CESJB — Dashboard</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <div class="layout">

        <!-- Menu Lateral -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h1>CESJB</h1>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item active">
                    <span class="nav-icon">🏠</span>
                    <span>Início</span>
                </a>
                <a href="associates.html" class="nav-item">
                    <span class="nav-icon">👥</span>
                    <span>Associados</span>
                </a>
                <a href="payments.html" class="nav-item">
                    <span class="nav-icon">💰</span>
                    <span>Pagamentos</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <p class="admin-name" id="adminName"></p>
                <button class="btn-logout" onclick="logout()">🚪 Sair</button>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">

            <header class="topbar">
                <h2 class="page-title">Início</h2>
            </header>

            <!-- Cards de Resumo -->
            <section class="cards">
                <div class="card">
                    <p class="card-label">Associados Ativos</p>
                    <p class="card-value" id="totalAssociates">—</p>
                </div>
                <div class="card">
                    <div class="card-label-row">
                        <p class="card-label">Pagamentos do Mês</p>
                        <button class="btn-toggle" id="btnToggle" onclick="togglePayments()" title="Mostrar/ocultar valor">
                            👁️
                        </button>
                    </div>
                    <p class="card-value" id="totalPayments">—</p>
                </div>
            </section>

            <!-- Tabela de Associados -->
            <section class="table-section">
                <h3 class="table-title">Associados Ativos</h3>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>Cargo</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="associatesTable">
                            <tr>
                                <td colspan="4" class="table-loading">Carregando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <script src="../js/dashboard.js"></script>
</body>
</html>
