<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CESJB — Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <div class="card">

            <div class="card-header">
                <h1 class="logo">CESJB</h1>
                <p class="subtitle">Sistema de Gerenciamento de Associados</p>
            </div>

            <div class="card-body">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="admin@cesjb.com.br"
                        autocomplete="email"
                    />
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                    />
                </div>

                <p class="error-message" id="errorMessage"></p>

                <button class="btn-login" id="btnLogin" onclick="login()">
                    Entrar
                </button>
            </div>

        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
